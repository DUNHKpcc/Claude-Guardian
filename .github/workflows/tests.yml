name: Unit and regression tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned test parser
        run: python -m pip install -r requirements-dev.txt
      - name: Unit and regression suite
        env:
          GUARDIAN_TEST_WINDOWS_TRANSACTION_BOUNDARY: "1"
          GUARDIAN_WINDOWS_LISTENER_CI: "1"
        run: python -m unittest discover -s tests -v
      - name: Owned PowerShell stage diagnostic (not probe acceptance)
        if: always() && runner.os == 'Windows'
        env:
          GUARDIAN_WINDOWS_DNS_DIAGNOSTIC: "1"
        run: python -m unittest discover -s tests -p test_windows_dns_probe.py -k test_owned_powershell_stage_diagnostic -v
      - name: Owned-process native context smoke (blocked is not desktop acceptance)
        env:
          GUARDIAN_NATIVE_CONTEXT_CI: "1"
        run: python -m unittest discover -s tests -p test_native_context_smoke.py -v
      - name: Synthetic WebRTC lifecycle regression (no network)
        run: node tests/webrtc-lifecycle.cjs
      - name: Compile runtime
        run: python -m compileall -q skills/claude-guardian/scripts
      - name: Build and verify reproducible package
        shell: bash
        run: |
          python tools/package_skill.py --output "$RUNNER_TEMP/guardian-a.zip"
          python tools/package_skill.py --output "$RUNNER_TEMP/guardian-b.zip"
          python -c "import os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP']); assert (p/'guardian-a.zip').read_bytes() == (p/'guardian-b.zip').read_bytes()"
      - name: Native CI metadata smoke (not desktop certification)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python - <<'PY'
          import json,subprocess,sys
          target = 'macos' if sys.platform == 'darwin' else 'windows'
          cmd = [sys.executable, 'skills/claude-guardian/scripts/guardian.py', 'check', '--target-ref', 'ci-runner', '--target-os', target, '--target-kind', 'local', '--namespace', 'desktop', '--execution-location', 'native_local', '--user-context', 'same', '--confirm-target', '--authorize-audit']
          result = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
          assert result.returncode == 0, 'Native metadata collector did not complete'
          report = json.loads(result.stdout)
          assert report['contact_control']['gate_state'] == 'closed'
          assert not report['changes']
          print('CI native metadata smoke:', target, 'facts:', len(report['facts']))
          print('No browser, proxy-path, permissions or user-desktop certification')
          PY
  minimum-python:
    name: Python 3.10 Linux runtime (not native desktop acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up minimum supported Python in disposable CI
        # Official actions/setup-python v6, verified 2026-10-15.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.10'
          architecture: x64
      - name: Verify actual interpreter version
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 10)"
      - name: Install pinned test parser
        run: python -m pip install -r requirements-dev.txt
      - name: Full unit and regression suite on minimum Python
        run: python -m unittest discover -s tests -v
      - name: Detached release package runtime without optional dependencies
        run: python -m unittest discover -s tests -p test_installed_skill.py -v
      - name: Compile runtime on minimum Python
        run: python -m compileall -q skills/claude-guardian/scripts
      - name: Build and verify reproducible package on minimum Python
        shell: bash
        run: |
          python tools/package_skill.py --output "$RUNNER_TEMP/minimum-a.zip"
          python tools/package_skill.py --output "$RUNNER_TEMP/minimum-b.zip"
          python -c "import os,pathlib; p=pathlib.Path(os.environ['RUNNER_TEMP']); assert (p/'minimum-a.zip').read_bytes() == (p/'minimum-b.zip').read_bytes()"
